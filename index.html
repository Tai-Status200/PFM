<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Room Schedule</title>
<style>
  :root {
    --navy: #1e3a5f;
    --slate: #47597a;
    --soft-blue: #eaf1fb;
    --white: #ffffff;
    --border: #d9e2ee;
    --accent: #4a7fc9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--soft-blue);
    color: var(--navy);
  }

  header {
    background: var(--navy);
    color: white;
    padding: 28px 16px 22px;
    text-align: center;
  }

  header img.logo {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    margin-bottom: 12px;
    background: white;
    padding: 4px;
  }

  header h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
    font-weight: 600;
  }

  header p {
    margin: 0;
    color: #c3d3e8;
    font-size: 0.95rem;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 14px 60px;
  }

  .upcoming-section {
    margin-bottom: 30px;
  }

  .upcoming-section > h2 {
    font-size: 1.15rem;
    margin: 0 0 12px;
    text-align: center;
    color: var(--navy);
  }

  .upcoming-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
  }

  .room-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(30, 58, 95, 0.06);
  }

  .room-card h3 {
    margin: 0 0 10px;
    font-size: 0.95rem;
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .booking-item {
    padding: 8px 0;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
  }

  .booking-item:first-of-type {
    border-top: none;
  }

  .booking-item .b-title {
    font-weight: 600;
    color: var(--navy);
    display: block;
  }

  .booking-item .b-time {
    color: var(--slate);
    font-size: 0.8rem;
  }

  .no-bookings {
    color: var(--slate);
    font-size: 0.82rem;
    font-style: italic;
    padding: 4px 0;
  }

  .upcoming-loading {
    text-align: center;
    color: var(--slate);
    font-size: 0.85rem;
    padding: 10px;
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
    justify-content: center;
  }

  .tab-btn {
    background: white;
    border: 1px solid var(--border);
    color: var(--slate);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s ease;
    font-weight: 500;
  }

  .tab-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .tab-btn.active {
    background: var(--navy);
    border-color: var(--navy);
    color: white;
  }

  .panel {
    display: none;
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(30, 58, 95, 0.08);
    border: 1px solid var(--border);
  }

  .panel.active {
    display: block;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .panel-header h2 {
    margin: 0;
    font-size: 1.1rem;
    color: var(--navy);
  }

  .badge {
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 999px;
    background: #fdeeda;
    color: #8a5a1c;
    font-weight: 600;
  }

  iframe {
    width: 100%;
    height: 600px;
    border: none;
    display: block;
  }

  .book-btn-wrap {
    text-align: center;
    margin: 26px 0 8px;
  }

  .book-btn {
    display: inline-block;
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.95rem;
    box-shadow: 0 3px 10px rgba(74, 127, 201, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .book-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(74, 127, 201, 0.45);
  }

  footer {
    text-align: center;
    color: var(--slate);
    font-size: 0.8rem;
    padding: 20px 14px 40px;
  }

  @media (max-width: 480px) {
    iframe { height: 480px; }
    header h1 { font-size: 1.3rem; }
  }
</style>
</head>

  <h1>Power of Faith Ministries and Church</h1>
  <p>Room Schedule — view availability below. Only approved leaders may book.</p>
</header>

<div class="container">

  <div class="upcoming-section">
    <h2>Upcoming Bookings</h2>
    <div id="upcomingGrid" class="upcoming-grid">
      <div class="upcoming-loading">Loading upcoming bookings…</div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="panels"></div>

  <div class="book-btn-wrap">
    <!-- Replace this href with your live Google Form link -->
    <a class="book-btn" href="#" id="bookLink">Request a Room Booking</a>
  </div>

</div>

<footer>
  Room calendars update automatically once a booking is approved.
</footer>

<script>
  const rooms = [
    {
      name: "Children Church",
      id: "e5fa0ba661bab11eecbb5b4dce807d6a78b193b5006f47796debaa77b7b26989@group.calendar.google.com",
      restricted: false
    },
    {
      name: "Main Church Building",
      id: "a06afb1ee39ce9be42efa8da2bb0214bba0ca174d07caaa2de8f9f5594df88a8@group.calendar.google.com",
      restricted: true
    },
    {
      name: "Music Institute",
      id: "c461f343266a7d0631133dca3fca5a421db9b8b15021f43d34449403b6c86934@group.calendar.google.com",
      restricted: false
    },
    {
      name: "Upper Room 1",
      id: "eb08299fecdeb22f01439963148619e13a16181d66d470a7e1ef5817088d800a@group.calendar.google.com",
      restricted: false
    },
    {
      name: "Upper Room 2",
      id: "83e506c5a3528f63c0617d63e1b34bf1eb752176738cc2c0275c776f1952ad06@group.calendar.google.com",
      restricted: false
    },
    {
      name: "Upper Room 3",
      id: "c94001b75978b06482c541cf8f0e22fd5f392ebb81186ed7da59409e45bb226c@group.calendar.google.com",
      restricted: false
    }
  ];

  const tabsEl = document.getElementById("tabs");
  const panelsEl = document.getElementById("panels");

  rooms.forEach((room, i) => {
    // Tab button
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (i === 0 ? " active" : "");
    btn.textContent = room.name;
    btn.onclick = () => selectTab(i);
    tabsEl.appendChild(btn);

    // Panel
    const panel = document.createElement("div");
    panel.className = "panel" + (i === 0 ? " active" : "");

    const embedSrc = "https://calendar.google.com/calendar/embed?src=" +
      encodeURIComponent(room.id) + "&ctz=America%2FJamaica&mode=WEEK&showTitle=0&showPrint=0&showTabs=0&showCalendars=0";

    panel.innerHTML =
      '<div class="panel-header">' +
        '<h2>' + room.name + '</h2>' +
        (room.restricted ? '<span class="badge">Requires Clearance</span>' : '') +
      '</div>' +
      '<iframe src="' + embedSrc + '" frameborder="0" scrolling="no"></iframe>';

    panelsEl.appendChild(panel);
  });

  function selectTab(index) {
    document.querySelectorAll(".tab-btn").forEach((b, i) => b.classList.toggle("active", i === index));
    document.querySelectorAll(".panel").forEach((p, i) => p.classList.toggle("active", i === index));
  }

  // TODO: set this to your real Google Form URL
  document.getElementById("bookLink").href = "https://docs.google.com/forms/d/e/1FAIpQLSfcnePiRuviwrIPggUVonlHuJ8b0kBeU-FWdrRW9quNlD8Lbw/viewform";

  // ============= UPCOMING BOOKINGS (grouped by room) =============

  // TODO: paste your Google Cloud API key between the quotes below — nothing else on this line.
  const CALENDAR_API_KEY = "AIzaSyACzSyOSHHDRQNhmVjkANypbd2fUx2yoD0";

  const MAX_PER_ROOM = 4; // how many upcoming bookings to show per room

  async function fetchUpcomingForRoom(room) {
    if (!CALENDAR_API_KEY || CALENDAR_API_KEY.indexOf("PASTE_") === 0) {
      return { room, error: "no-key" };
    }
    const timeMin = new Date().toISOString();
    const url = "https://www.googleapis.com/calendar/v3/calendars/" +
      encodeURIComponent(room.id) +
      "/events?key=" + CALENDAR_API_KEY +
      "&timeMin=" + encodeURIComponent(timeMin) +
      "&singleEvents=true&orderBy=startTime&maxResults=" + MAX_PER_ROOM;

    try {
      const res = await fetch(url);
      if (!res.ok) {
        return { room, error: "fetch-failed" };
      }
      const data = await res.json();
      return { room, events: data.items || [] };
    } catch (err) {
      return { room, error: "network" };
    }
  }

  function formatEventTime(ev) {
    const start = ev.start.dateTime || ev.start.date;
    const end = ev.end.dateTime || ev.end.date;
    const startDt = new Date(start);
    const endDt = new Date(end);
    const dateStr = startDt.toLocaleDateString("en-JM", { weekday: "short", month: "short", day: "numeric" });
    const startTimeStr = ev.start.dateTime
      ? startDt.toLocaleTimeString("en-JM", { hour: "numeric", minute: "2-digit" })
      : "All day";
    const endTimeStr = ev.end.dateTime
      ? endDt.toLocaleTimeString("en-JM", { hour: "numeric", minute: "2-digit" })
      : "";
    return endTimeStr ? (dateStr + " · " + startTimeStr + " – " + endTimeStr) : dateStr;
  }

  async function loadUpcomingBookings() {
    const grid = document.getElementById("upcomingGrid");
    const results = await Promise.all(rooms.map(fetchUpcomingForRoom));

    grid.innerHTML = "";

    results.forEach(result => {
      const card = document.createElement("div");
      card.className = "room-card";

      let bodyHtml = "";

      if (result.error === "no-key") {
        bodyHtml = '<div class="no-bookings">Add a Calendar API key to enable this list.</div>';
      } else if (result.error) {
        bodyHtml = '<div class="no-bookings">Could not load bookings right now.</div>';
      } else if (!result.events.length) {
        bodyHtml = '<div class="no-bookings">No upcoming bookings.</div>';
      } else {
        bodyHtml = result.events.map(ev => {
          const title = (ev.summary || "Booked").replace(/</g, "&lt;");
          return '<div class="booking-item">' +
            '<span class="b-title">' + title + '</span>' +
            '<span class="b-time">' + formatEventTime(ev) + '</span>' +
          '</div>';
        }).join("");
      }

      card.innerHTML = '<h3>' + result.room.name +
        (result.room.restricted ? '<span class="badge">Clearance</span>' : '') +
        '</h3>' + bodyHtml;

      grid.appendChild(card);
    });
  }

  loadUpcomingBookings();
</script>

</body>
</html>
