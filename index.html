<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Room Booking System</title>
  <style>
    /* ELDER-FRIENDLY STYLING: HIGH CONTRAST, LARGE FONTS, BIG BUTTONS */
    :root {
      --primary: #1a56db;
      --primary-hover: #1e40af;
      --success: #057a55;
      --danger: #e24c4c;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      font-size: 18px; /* Larger base font size for readability */
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 32px;
      color: #111827;
      margin-bottom: 10px;
    }

    .card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    h2 {
      font-size: 24px;
      margin-top: 0;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 10px;
    }

    /* FORM INPUTS - LARGE AND EASY TO TAP */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 20px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      box-sizing: border-box;
      background-color: #f9fafb;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #fff;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* MASSIVE BUTTONS */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
    }

    .btn:hover { background-color: var(--primary-hover); }
    .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }

    .btn-danger {
      background-color: var(--danger);
      width: auto;
      padding: 10px 18px;
      font-size: 16px;
      margin-top: 10px;
    }
    
    .btn-danger:hover { background-color: #b91c1c; }

    /* STATUS BANNERS */
    #status-banner {
      display: none;
      padding: 20px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }

    .banner-error { background-color: #fee2e2; color: #991b1b; border: 2px solid #f87171; }
    .banner-success { background-color: #d1fae5; color: #065f46; border: 2px solid #34d399; }
    .banner-loading { background-color: #e0f2fe; color: #075985; border: 2px solid #38bdf8; }

    /* UPCOMING EVENTS LIST */
    .event-item {
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      background-color: #fafafa;
    }

    .event-title { font-size: 22px; font-weight: bold; color: var(--primary); }
    .event-time { font-size: 18px; color: #4b5563; margin: 8px 0; }
    .event-room { display: inline-block; background: #e5e7eb; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 16px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⛪ Church Room Booking</h1>
      <p>Select a room, date, and time below to reserve your space.</p>
    </header>

    <!-- STATUS ALERT BANNER -->
    <div id="status-banner"></div>

    <!-- BOOKING FORM -->
    <div class="card">
      <h2>1. Request a Room</h2>
      <form id="booking-form">
        
        <div class="form-group">
          <label for="room">Select Room / Area:</label>
          <select id="room" required>
            <option value="" disabled selected>-- Touch here to choose a room --</option>
            <option value="Main Church Building">Main Church Building</option>
            <option value="Children Church">Children Church</option>
            <option value="Music Institute">Music Institute</option>
            <option value="Upper Room 1">Upper Room 1</option>
            <option value="Upper Room 2">Upper Room 2</option>
            <option value="Upper Room 3">Upper Room 3</option>
          </select>
        </div>

        <div class="form-group">
          <label for="group-name">Group or Ministry Name:</label>
          <input type="text" id="group-name" placeholder="e.g., Youth Ministry, Choir Practice" required>
        </div>

        <div class="form-group">
          <label for="email">Your Approved Leader Email:</label>
          <input type="email" id="email" placeholder="e.g., yourname@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="date">Date of Event:</label>
          <input type="date" id="date" required>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="start-time">Start Time:</label>
            <input type="time" id="start-time" required>
          </div>
          <div class="form-group">
            <label for="end-time">End Time:</label>
            <input type="time" id="end-time" required>
          </div>
        </div>

        <button type="submit" class="btn" id="submit-btn">📅 Check Availability & Book</button>
      </form>
    </div>

    <!-- UPCOMING BOOKINGS LIST -->
    <div class="card">
      <h2>2. Current & Upcoming Bookings</h2>
      <p style="color: #6b7280; font-size: 16px;">Check below to see what is already scheduled for the next 30 days.</p>
      <div id="events-container">
        <p>Loading schedule... please wait.</p>
      </div>
    </div>
  </div>

  <script>
    // ================= CONFIGURATION =================
    // PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE:
    const WEB_APP_URL = "AIzaSyACzSyOSHHDRQNhmVjkANypbd2fUx2yoD0"; 
    
    let allFetchedEvents = [];

    // Initialize date picker to today's date by default
    document.getElementById('date').min = new Date().toISOString().split("T")[0];

    // Load events as soon as the webpage opens
    window.onload = fetchUpcomingEvents;

    // ================= FETCH & RENDER EVENTS =================
    async function fetchUpcomingEvents() {
      const container = document.getElementById("events-container");
      try {
        const response = await fetch(WEB_APP_URL);
        const data = await response.json();

        if (data.status === "success") {
          allFetchedEvents = data.events;
          renderEventsList(allFetchedEvents);
        } else {
          container.innerHTML = `<p style="color:red;">Could not load schedule: ${data.message}</p>`;
        }
      } catch (err) {
        container.innerHTML = `<p style="color:red;">Failed to connect to the church calendar system. Please refresh the page.</p>`;
      }
    }

    function renderEventsList(events) {
      const container = document.getElementById("events-container");
      if (events.length === 0) {
        container.innerHTML = "<p>No upcoming bookings scheduled for the next 30 days. All rooms are free!</p>";
        return;
      }

      // Sort events chronologically
      events.sort((a, b) => new Date(a.start) - new Date(b.start));

      let html = "";
      events.forEach(ev => {
        const startDate = new Date(ev.start);
        const endDate = new Date(ev.end);
        
        // Easy-to-read formatting (e.g., "Sunday, August 2 | 2:00 PM - 4:00 PM")
        const dateStr = startDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        const startStr = startDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const endStr = endDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

        html += `
          <div class="event-item">
            <span class="event-room">${ev.room}</span>
            <div class="event-title">${ev.title}</div>
            <div class="event-time">🕒 ${dateStr} | <strong>${startStr} - ${endStr}</strong></div>
            <button class="btn btn-danger" onclick="deleteBooking('${ev.id}', '${ev.room}')">🗑️ Remove Booking</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // ================= INSTANT OVERLAP CHECK =================
    function checkTimeConflict(room, newStart, newEnd) {
      for (let ev of allFetchedEvents) {
        if (ev.room === room) {
          const existingStart = new Date(ev.start);
          const existingEnd = new Date(ev.end);

          // Overlap formula: (NewStart < ExistingEnd) AND (NewEnd > ExistingStart)
          if (newStart < existingEnd && newEnd > existingStart) {
            return ev; // Return the conflicting event details
          }
        }
      }
      return null; // No conflict found!
    }

    // ================= FORM SUBMISSION =================
    document.getElementById("booking-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const room = document.getElementById("room").value;
      const groupName = document.getElementById("group-name").value.trim();
      const email = document.getElementById("email").value.trim();
      const date = document.getElementById("date").value;
      const startTime = document.getElementById("start-time").value;
      const endTime = document.getElementById("end-time").value;

      const newStart = new Date(`${date}T${startTime}`);
      const newEnd = new Date(`${date}T${endTime}`);

      // 1. Basic logical check
      if (newEnd <= newStart) {
        showBanner("⚠️ The End Time must be later than the Start Time.", "error");
        return;
      }

      // 2. INSTANT OVERLAP CHECK
      const conflict = checkTimeConflict(room, newStart, newEnd);
      if (conflict) {
        const conflictStart = new Date(conflict.start).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const conflictEnd = new Date(conflict.end).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        
        showBanner(`⚠️ CANNOT BOOK: The ${room} is already reserved for "${conflict.title}" from ${conflictStart} to ${conflictEnd}. Please choose a different time!`, "error");
        return;
      }

      // 3. Send to Google Apps Script if time is clear
      showBanner("⏳ Sending your booking to the calendar... please wait.", "loading");
      document.getElementById("submit-btn").disabled = true;

      try {
        const payload = {
          action: "CREATE",
          room: room,
          groupName: groupName,
          email: email,
          date: date,
          startTime: startTime,
          endTime: endTime
        };

        // Note: We use text/plain to avoid CORS preflight errors with Google Apps Script
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          showBanner(`✅ SUCCESS: Your booking for ${room} is confirmed!`, "success");
          document.getElementById("booking-form").reset();
          fetchUpcomingEvents(); // Refresh schedule automatically
        } else {
          showBanner(`❌ BOOKING FAILED: ${result.message}`, "error");
        }
      } catch (err) {
        showBanner("❌ Network Error: Could not connect to the booking server.", "error");
      } finally {
        document.getElementById("submit-btn").disabled = false;
      }
    });

    // ================= DELETE BOOKING =================
    async function deleteBooking(eventId, room) {
      const email = prompt(`To remove this booking from the ${room} calendar, please enter your Approved Leader Email Address:`);
      if (!email) return; // User canceled

      showBanner("⏳ Removing booking... please wait.", "loading");

      try {
        const payload = {
          action: "DELETE",
          eventId: eventId,
          room: room,
          email: email.trim()
        };

        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          showBanner("🗑️ Booking successfully removed from the calendar.", "success");
          fetchUpcomingEvents(); // Refresh list
        } else {
          alert(`Could not remove booking: ${result.message}`);
          showBanner(`❌ Removal Failed: ${result.message}`, "error");
        }
      } catch (err) {
        alert("Network error while trying to remove booking.");
      }
    }

    // ================= HELPER: SHOW STATUS BANNER =================
    function showBanner(text, type) {
      const banner = document.getElementById("status-banner");
      banner.textContent = text;
      banner.className = `banner-${type}`;
      banner.style.display = "block";
      
      // Scroll up slightly so the elder sees the message
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
