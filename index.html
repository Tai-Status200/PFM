<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Power of Faith Ministries International Inc. — Room Booking</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f2b5c">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PFM Bookings">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">

  <script>
    (function() {
      var saved = localStorage.getItem('pfm_theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    :root {
      --primary: #0f2b5c;
      --primary-light: #1e40af;
      --accent: #2563eb;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #dc2626;
      --shadow: 0 4px 20px -4px rgba(15, 43, 92, 0.12);
    }

    html[data-theme="dark"] {
      --primary: #3b82f6;
      --primary-light: #60a5fa;
      --accent: #60a5fa;
      --bg: #0b1220;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #1f2937;
      --text: #e5e7eb;
      --text-muted: #94a3b8;
      --danger: #f87171;
      --shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .landing-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .church-logo {
      width: 84px;
      height: 84px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
      color: var(--primary);
      line-height: 1.3;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 16px;
      margin: 0 0 32px 0;
    }

    .choice-btn {
      display: block;
      width: 100%;
      text-decoration: none;
      padding: 20px 22px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: none;
      cursor: pointer;
    }

    .choice-btn:last-of-type { margin-bottom: 0; }

    .choice-btn:hover {
      transform: translateY(-2px);
    }

    .choice-btn-leader {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 6px 16px -4px rgba(15, 43, 92, 0.4);
    }

    .choice-btn-leader:hover {
      box-shadow: 0 10px 22px -4px rgba(15, 43, 92, 0.5);
    }

    .choice-btn-member {
      background: var(--surface-2);
      color: var(--primary);
      border: 2px solid var(--border);
    }

    html[data-theme="dark"] .choice-btn-member {
      color: var(--primary-light);
    }

    .choice-desc {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-top: 4px;
      opacity: 0.85;
    }

    .theme-toggle-small {
      position: fixed;
      top: 18px;
      right: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <button type="button" class="theme-toggle-small" onclick="toggleTheme()" id="theme-toggle-btn" aria-label="Toggle dark mode">
    <svg id="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <svg id="theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    <span id="theme-toggle-label">Dark Mode</span>
  </button>

  <div class="landing-card">
    <img src="PFM.png" alt="The Power of Faith Ministries International Inc. Logo" class="church-logo">
    <h1>The Power of Faith Ministries International Inc.</h1>
    <p class="subtitle">Facility &amp; Room Reservation System</p>

    <a href="leader.html" class="choice-btn choice-btn-leader">
      I'm a Leader
      <span class="choice-desc">Sign in to book, manage, or cancel a room reservation</span>
    </a>

    <a href="member.html" class="choice-btn choice-btn-member">
      I'm a Member
      <span class="choice-desc">View the schedule — no sign-in required</span>
    </a>
  </div>

  <script>
    const THEME_STORAGE_KEY = 'pfm_theme';
    const THEME_COLOR_LIGHT = '#0f2b5c';
    const THEME_COLOR_DARK = '#0f172a';

    function getCurrentTheme() {
      return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(THEME_STORAGE_KEY, theme);

      const metaThemeColor = document.querySelector('meta[name="theme-color"]');
      if (metaThemeColor) {
        metaThemeColor.setAttribute('content', theme === 'dark' ? THEME_COLOR_DARK : THEME_COLOR_LIGHT);
      }

      const moonIcon = document.getElementById('theme-icon-moon');
      const sunIcon = document.getElementById('theme-icon-sun');
      const label = document.getElementById('theme-toggle-label');

      if (theme === 'dark') {
        moonIcon.style.display = 'none';
        sunIcon.style.display = 'inline';
        label.textContent = 'Light Mode';
      } else {
        moonIcon.style.display = 'inline';
        sunIcon.style.display = 'none';
        label.textContent = 'Dark Mode';
      }
    }

    function toggleTheme() {
      applyTheme(getCurrentTheme() === 'dark' ? 'light' : 'dark');
    }

    applyTheme(getCurrentTheme());

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function(err) {
          console.log('Service worker registration failed (non-critical):', err);
        });
      });
    }
  </script>
</body>
</html>
