<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power of Faith Ministries International Inc. — Room Booking</title>
  <style>
    /* MODERN, HIGH-CONTRAST ACCESSIBLE DESIGN SYSTEM */
    :root {
      --primary: #0f2b5c;       /* Deep Church Royal Blue */
      --primary-light: #1e40af;
      --accent: #2563eb;
      --success: #047857;
      --danger: #dc2626;
      --bg: #f8fafc;            /* Crisp modern light slate background */
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 25px -5px rgba(15, 43, 92, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      margin: 0;
      padding: 24px 16px;
      font-size: 19px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* HEADER & LOGO BRANDING */
    header {
      text-align: center;
      margin-bottom: 35px;
      background: var(--card-bg);
      padding: 28px 20px;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      border-top: 6px solid var(--primary);
    }

    .logo-container {
      margin-bottom: 16px;
    }

    .church-logo {
      max-width: 100%;
      height: auto;
      max-height: 110px;
      object-fit: contain;
    }

    h1 {
      font-size: 28px;
      color: var(--primary);
      margin: 10px 0 6px 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .subtitle {
      font-size: 18px;
      color: var(--text-muted);
      margin: 0;
      font-weight: 500;
    }

    /* CARDS */
    .card {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 32px;
      border: 1px solid #e2e8f0;
    }

    h2 {
      font-size: 23px;
      color: var(--primary);
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* FORM INPUTS */
    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 20px;
      color: var(--text-main);
    }

    input, select {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      box-sizing: border-box;
      background-color: #f8fafc;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 640px) {
      .grid-2 { grid-template-columns: 1fr; }
      body { padding: 16px 12px; }
      .card { padding: 20px; }
      h1 { font-size: 24px; }
    }

    /* BUTTONS */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 18px;
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: var(--shadow-sm);
    }

    .btn:hover { background-color: var(--primary-light); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .btn-danger {
      background-color: var(--danger);
      width: auto;
      padding: 10px 18px;
      font-size: 16px;
      margin-top: 12px;
      border-radius: 8px;
    }
    
    .btn-danger:hover { background-color: #b91c1c; }

    /* STATUS BANNERS */
    #status-banner {
      display: none;
      padding: 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
      line-height: 1.4;
    }

    .banner-error { background-color: #fef2f2; color: #991b1b; border: 2px solid #f87171; }
    .banner-success { background-color: #ecfdf5; color: #065f46; border: 2px solid #34d399; }
    .banner-loading { background-color: #f0f9ff; color: #075985; border: 2px solid #38bdf8; }

    /* UPCOMING EVENTS LIST */
    .event-item {
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      background-color: #ffffff;
      transition: border-color 0.2s;
    }

    .event-item:hover {
      border-color: #cbd5e1;
    }

    .event-title { 
      font-size: 22px; 
      font-weight: 800; 
      color: var(--primary); 
      margin-top: 6px;
    }

    .event-time { 
      font-size: 18px; 
      color: var(--text-muted); 
      margin: 8px 0; 
    }

    .event-room { 
      display: inline-block; 
      background: #e0e7ff; 
      color: var(--primary);
      padding: 4px 14px; 
      border-radius: 20px; 
      font-weight: 700; 
      font-size: 16px; 
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- HEADER WITH CHURCH LOGO -->
    <header>
      <div class="logo-container">
        <img src="PFM.png" alt="The Power of Faith Ministries International Inc. Logo" class="church-logo">
      </div>
      <h1>The Power of Faith Ministries International Inc.</h1>
      <p class="subtitle">Facility & Room Reservation System</p>
    </header>

    <!-- STATUS ALERT BANNER -->
    <div id="status-banner"></div>

    <!-- BOOKING FORM -->
    <div class="card">
      <h2>1. Reserve a Facility</h2>
      <form id="booking-form">
        
        <div class="form-group">
          <label for="room">Select Room / Area:</label>
          <select id="room" required>
            <option value="" disabled selected>-- Touch here to choose a room --</option>
            <option value="Main Church Building">Main Church Building</option>
            <option value="Children Church">Children Church</option>
            <option value="Music Institute">Music Institute</option>
            <option value="Upper Room 1">Upper Room 1</option>
            <option value="Upper Room 2">Upper Room 2</option>
            <option value="Upper Room 3">Upper Room 3</option>
          </select>
        </div>

        <div class="form-group">
          <label for="group-name">Group or Ministry Name:</label>
          <input type="text" id="group-name" placeholder="e.g., Youth Ministry, Choir Practice" required>
        </div>

        <div class="form-group">
          <label for="email">Your Approved Leader Email:</label>
          <input type="email" id="email" placeholder="e.g., yourname@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="date">Date of Event:</label>
          <input type="date" id="date" required>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="start-time">Start Time:</label>
            <input type="time" id="start-time" required>
          </div>
          <div class="form-group">
            <label for="end-time">End Time:</label>
            <input type="time" id="end-time" required>
          </div>
        </div>

        <button type="submit" class="btn" id="submit-btn">Check Availability & Book</button>
      </form>
    </div>

    <!-- UPCOMING BOOKINGS LIST -->
    <div class="card">
      <h2>2. Scheduled Bookings</h2>
      <p style="color: var(--text-muted); font-size: 17px; margin-top: -8px;">Review existing reservations for the next 30 days before booking.</p>
      <div id="events-container">
        <p>Loading schedule... please wait.</p>
      </div>
    </div>
  </div>

  <script>
    // ================= CONFIGURATION =================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxt7PtVWgHCVByCDm83EDVekvNLFnvpDd93_0T2TE5y6-IvQkgOYfNZZ-hlnESvnUia/exec"; 
    
    let allFetchedEvents = [];

    // Initialize date picker to today's date by default
    document.getElementById('date').min = new Date().toISOString().split("T")[0];

    // Load events as soon as the webpage opens
    window.onload = fetchUpcomingEvents;

    // ================= FETCH & RENDER EVENTS =================
    async function fetchUpcomingEvents() {
      const container = document.getElementById("events-container");
      try {
        const response = await fetch(WEB_APP_URL);
        const data = await response.json();

        if (data.status === "success") {
          allFetchedEvents = data.events;
          renderEventsList(allFetchedEvents);
        } else {
          container.innerHTML = `<p style="color:var(--danger);">Could not load schedule: ${data.message}</p>`;
        }
      } catch (err) {
        container.innerHTML = `<p style="color:var(--danger);">Failed to connect to the church calendar system. Please refresh the page.</p>`;
      }
    }

    function renderEventsList(events) {
      const container = document.getElementById("events-container");
      if (events.length === 0) {
        container.innerHTML = "<p style='color: var(--text-muted); font-weight: 500;'>No upcoming bookings scheduled for the next 30 days. All rooms are available!</p>";
        return;
      }

      // Sort events chronologically
      events.sort((a, b) => new Date(a.start) - new Date(b.start));

      let html = "";
      events.forEach(ev => {
        const startDate = new Date(ev.start);
        const endDate = new Date(ev.end);
        
        // Easy-to-read formatting (e.g., "Sunday, August 2 | 2:00 PM - 4:00 PM")
        const dateStr = startDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        const startStr = startDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const endStr = endDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

        html += `
          <div class="event-item">
            <span class="event-room">${ev.room}</span>
            <div class="event-title">${ev.title}</div>
            <div class="event-time">${dateStr} | <strong>${startStr} - ${endStr}</strong></div>
            <button class="btn btn-danger" onclick="deleteBooking('${ev.id}', '${ev.room}')">Remove Booking</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // ================= INSTANT OVERLAP CHECK =================
    function checkTimeConflict(room, newStart, newEnd) {
      for (let ev of allFetchedEvents) {
        if (ev.room === room) {
          const existingStart = new Date(ev.start);
          const existingEnd = new Date(ev.end);

          // Overlap formula: (NewStart < ExistingEnd) AND (NewEnd > ExistingStart)
          if (newStart < existingEnd && newEnd > existingStart) {
            return ev; // Return conflicting event
          }
        }
      }
      return null;
    }

    // ================= FORM SUBMISSION =================
    document.getElementById("booking-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const room = document.getElementById("room").value;
      const groupName = document.getElementById("group-name").value.trim();
      const email = document.getElementById("email").value.trim();
      const date = document.getElementById("date").value;
      const startTime = document.getElementById("start-time").value;
      const endTime = document.getElementById("end-time").value;

      const newStart = new Date(`${date}T${startTime}`);
      const newEnd = new Date(`${date}T${endTime}`);

      // 1. Basic logical check
      if (newEnd <= newStart) {
        showBanner("The End Time must be later than the Start Time.", "error");
        return;
      }

      // 2. INSTANT OVERLAP CHECK
      const conflict = checkTimeConflict(room, newStart, newEnd);
      if (conflict) {
        const conflictStart = new Date(conflict.start).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const conflictEnd = new Date(conflict.end).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        
        showBanner(`CANNOT BOOK: The ${room} is already reserved for "${conflict.title}" from ${conflictStart} to ${conflictEnd}. Please select a different time!`, "error");
        return;
      }

      // 3. Send request if time slot is clear
      showBanner("Sending your booking request to the server... please wait.", "loading");
      document.getElementById("submit-btn").disabled = true;

      try {
        const payload = {
          action: "CREATE",
          room: room,
          groupName: groupName,
          email: email,
          date: date,
          startTime: startTime,
          endTime: endTime
        };

        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          showBanner(`SUCCESS: Your booking for ${room} has been confirmed!`, "success");
          document.getElementById("booking-form").reset();
          fetchUpcomingEvents(); // Refresh schedule automatically
        } else {
          showBanner(`BOOKING FAILED: ${result.message}`, "error");
        }
      } catch (err) {
        showBanner("Network Error: Could not connect to the booking server.", "error");
      } finally {
        document.getElementById("submit-btn").disabled = false;
      }
    });

    // ================= DELETE BOOKING =================
    async function deleteBooking(eventId, room) {
      const email = prompt(`To remove this booking from the ${room} calendar, please enter your Approved Leader Email Address:`);
      if (!email) return;

      showBanner("Removing booking... please wait.", "loading");

      try {
        const payload = {
          action: "DELETE",
          eventId: eventId,
          room: room,
          email: email.trim()
        };

        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          showBanner("Booking successfully removed from the calendar.", "success");
          fetchUpcomingEvents();
        } else {
          alert(`Could not remove booking: ${result.message}`);
          showBanner(`Removal Failed: ${result.message}`, "error");
        }
      } catch (err) {
        alert("Network error while trying to remove booking.");
      }
    }

    // ================= HELPER: SHOW STATUS BANNER =================
    function showBanner(text, type) {
      const banner = document.getElementById("status-banner");
      banner.textContent = text;
      banner.className = `banner-${type}`;
      banner.style.display = "block";
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
